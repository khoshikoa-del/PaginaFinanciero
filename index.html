<script>
"use strict";
const UNITS=["Operaciones","Tecnología","Comercial","Administración"];
const SCENARIOS={
 ideal:{name:"Ideal",description:"Operación estable, costos y necesidades en niveles previstos.",why:"Línea base de planificación: necesidades presupuestarias regulares.",A:[[8,-1,0,0],[-1,7,-1,0],[0,-1,6,-1],[0,0,-1,5]],b:[800,400,300,200]},
 estres:{name:"Bajo estrés financiero",description:"Aumentan los requerimientos por inflación y presión de costos.",why:"Se incrementan los términos independientes b en un 15 % para representar mayores necesidades de caja; A se conserva para aislar el desplazamiento del equilibrio.",A:[[8,-1,0,0],[-1,7,-1,0],[0,-1,6,-1],[0,0,-1,5]],b:[920,460,345,230]},
 mal:{name:"Mal condicionado",description:"Mismo modelo con escalamiento desigual de las unidades.",why:"Se cambia la escala de las unidades mediante una transformación diagonal congruente. La matriz sigue siendo simétrica definida positiva y presenta mal escalamiento diagonal; Jacobi es el precondicionador pertinente.",A:[[3,-10,0,0],[-10,300,-1000,0],[0,-1000,30000,-100000],[0,0,-100000,3000000]],b:[200,1000,10000,200000]}
};
let active="ideal",A=clone(SCENARIOS.ideal.A),b=SCENARIOS.ideal.b.slice(),x0=[0,0,0,0],tol=1e-6,maxIt=1000,preconditioner="jacobi";
let editedManually=false;
const $=id=>document.getElementById(id);
function clone(x){return JSON.parse(JSON.stringify(x))}
const dot=(u,v)=>u.reduce((s,x,i)=>s+x*v[i],0),norm=u=>Math.sqrt(dot(u,u));
const mv=(M,v)=>M.map(r=>dot(r,v)),sub=(u,v)=>u.map((x,i)=>x-v[i]),add=(u,v)=>u.map((x,i)=>x+v[i]),mul=(u,k)=>u.map(x=>x*k);
const fmt=x=>Number(x).toLocaleString("es-BO",{maximumFractionDigits:8}),sci=x=>Number(x).toExponential(4);
function validate(M,r){let n=r.length;if(n<4||M.length!==n||M.some(row=>!Array.isArray(row)||row.length!==n))throw Error("Se requiere una matriz cuadrada compatible con b y con n ≥ 4.");if(!M.flat().every(Number.isFinite)||!r.every(Number.isFinite))throw Error("Todos los coeficientes deben ser números finitos.");}
function symmetry(M){let scale=Math.max(1,...M.flat().map(Math.abs));return M.every((r,i)=>r.every((v,j)=>Math.abs(v-M[j][i])<=1e-12*scale));}
function determinant(M){if(M.length===1)return M[0][0];let d=0;for(let j=0;j<M.length;j++)d+=(j%2?-1:1)*M[0][j]*determinant(M.slice(1).map(r=>r.filter((_,k)=>k!==j)));return d;}
function leadingMinors(M){return M.map((_,i)=>determinant(M.slice(0,i+1).map(r=>r.slice(0,i+1))));}
function cholesky(M){validate(M,M.map(()=>0));if(!symmetry(M))throw Error("A no es simétrica: debe cumplirse A = Aᵀ.");let n=M.length,L=Array.from({length:n},()=>Array(n).fill(0)),scale=Math.max(1,...M.flat().map(Math.abs));for(let i=0;i<n;i++)for(let j=0;j<=i;j++){let s=M[i][j];for(let k=0;k<j;k++)s-=L[i][k]*L[j][k];if(i===j){if(s<=1e-14*scale)throw Error("A no es definida positiva.");L[i][j]=Math.sqrt(s);}else L[i][j]=s/L[j][j];}return L;}
function gauss(M,r){validate(M,r);let n=r.length,T=M.map((row,i)=>row.concat(r[i]));for(let k=0;k<n;k++){let p=k;for(let i=k+1;i<n;i++)if(Math.abs(T[i][k])>Math.abs(T[p][k]))p=i;if(Math.abs(T[p][k])<1e-14)throw Error("Matriz singular o numéricamente singular.");[T[p],T[k]]=[T[k],T[p]];for(let i=k+1;i<n;i++){let f=T[i][k]/T[k][k];for(let j=k;j<=n;j++)T[i][j]-=f*T[k][j];}}let x=Array(n).fill(0);for(let i=n-1;i>=0;i--){let s=T[i][n];for(let j=i+1;j<n;j++)s-=T[i][j]*x[j];x[i]=s/T[i][i];}return x;}
function residual(M,x,r){return sub(r,mv(M,x))}
function relres(M,x,r){return norm(residual(M,x,r))/(norm(r)||1)}
function inverse(M){let n=M.length,T=M.map((r,i)=>r.concat(Array.from({length:n},(_,j)=>i===j?1:0)));for(let k=0;k<n;k++){let p=k;for(let i=k+1;i<n;i++)if(Math.abs(T[i][k])>Math.abs(T[p][k]))p=i;if(Math.abs(T[p][k])<1e-25)throw Error("Matriz no invertible.");[T[p],T[k]]=[T[k],T[p]];let d=T[k][k];for(let j=0;j<2*n;j++)T[k][j]/=d;for(let i=0;i<n;i++)if(i!==k){let f=T[i][k];for(let j=0;j<2*n;j++)T[i][j]-=f*T[k][j];}}return T.map(r=>r.slice(n));}
const normInf=M=>{if(!M.length)return 0;return Math.max(...M.map(r=>r.reduce((s,v)=>s+Math.abs(v),0)))};
function matmul(X,Y){return X.map(r=>Y[0].map((_,j)=>r.reduce((s,v,k)=>s+v*Y[k][j],0)))}
function condition(M){return normInf(M)*normInf(inverse(M))}
function preconditionedCondition(M,kind){
  if(kind==="jacobi"){
    let d=M.map((r,i)=>Math.sqrt(r[i]));
    if(d.some(v=>!(v>0)))throw Error("Jacobi requiere diagonal positiva.");
    let S=M.map((r,i)=>r.map((v,j)=>v/(d[i]*d[j])));
    return condition(S);
  }
  return condition(M);
}
function cg(M,r,usePre=false){
  validate(M,r);
  cholesky(M);
  let n=r.length;
  if(usePre&&M.some((row,i)=>row[i]<=0))throw Error("Jacobi necesita elementos diagonales positivos.");
  let x=x0.slice(),rr=residual(M,x,r),z=usePre?rr.map((v,i)=>v/M[i][i]):rr.slice(),p=z.slice(),rho=dot(rr,z),denom=norm(r)||1,rel=norm(rr)/denom;
  if(rel<tol)return{x,it:0,rel,ok:true};
  for(let k=0;k<maxIt;k++){
    let Ap=mv(M,p),pAp=dot(p,Ap);
    if(!(pAp>0))throw Error("Se detectó pᵀAp no positivo.");
    let alpha=rho/pAp;
    x=add(x,mul(p,alpha));
    let rn=sub(rr,mul(Ap,alpha));
    rel=norm(rn)/denom;
    if(rel<tol)return{x,it:k+1,rel,ok:true};
    let zn=usePre?rn.map((v,i)=>v/M[i][i]):rn.slice(),rhoNew=dot(rn,zn);
    if(!Number.isFinite(rhoNew)||rho===0)break;
    let beta=rhoNew/rho;
    p=add(zn,mul(p,beta));
    rr=rn;z=zn;rho=rhoNew;
  }
  return{x,it:maxIt,rel,ok:false};
}
function vectorTable(x){return `<div class="tablewrap"><table><tr><th>Variable financiera</th><th>Valor (UPN)</th></tr>${x.map((v,i)=>`<tr><td>x${i+1} · ${UNITS[i]}</td><td>${fmt(v)}</td></tr>`).join("")}</table></div>`}
function matrixText(M,r){return `A =\n${M.map(row=>"[ "+row.map(fmt).join("\t")+" ]").join("\n")}\n\nb = [ ${r.map(fmt).join(", ")} ]ᵀ`}
function title(t,d){return `<h2>${t}</h2><p class="muted">${d}</p>`}
function minorTable(M){let sm=symmetry(M),mins=leadingMinors(M);return `<p>Simetría A = Aᵀ: <b class="${sm?"good":"bad"}">${sm?"Verificada":"No cumple"}</b></p><table><tr><th>Menor principal líder</th><th>Determinante</th><th>Conclusión</th></tr>${mins.map((v,i)=>`<tr><td>Δ${i+1}</td><td>${sci(v)}</td><td class="${v>0?"good":"bad"}">${v>0?"Positivo":"No positivo"}</td></tr>`).join("")}</table><p class="${sm&&mins.every(v=>v>0)?"success":"error"}">${sm&&mins.every(v=>v>0)?"Por el criterio de Sylvester, A es simétrica definida positiva.":"No se ha demostrado que A sea simétrica definida positiva."}</p>`}
function scenarioOptions(){return Object.entries(SCENARIOS).map(([k,s])=>`<option value="${k}" ${k===active&&!editedManually?"selected":""}>${s.name}</option>`).join("")}
function activeLabel(){return editedManually?"datos editados manualmente":(SCENARIOS[active]?.name||"datos editados")}

function render(page){let h="";
if(page==="inicio")h=title("Panel del proyecto","Aplicación web interactiva para modelar y resolver sistemas financieros Ax=b.")+`<div class="grid"><div class="stat">Escenarios<strong>3</strong></div><div class="stat">Variables<strong>4</strong></div><div class="stat">Métodos<strong>GC / GCP</strong></div><div class="stat">Tolerancia<strong>10⁻⁶</strong></div></div><div class="card"><h3>Estudiante: Estrella Condori</h3><p><b>Mención:</b> Ingeniería en Sistemas · <b>Empresa:</b> Multiservicios Andina S.R.L. (ficticia).</p><p>El sistema apoya la planificación financiera y distribución de recursos entre Operaciones, Tecnología, Comercial y Administración.</p><div class="notice"><b>Objetivo:</b> analizar precisión, número de condición y velocidad de convergencia de Gradientes Conjugados Precondicionado, usando GC como contraste, en tres escenarios financieros.</div></div>`;
if(page==="caso")h=title("Caso financiero y aporte de Ingeniería de Sistemas","Planificación financiera y distribución de recursos entre cuatro unidades.")+`<div class="card"><h3>Contexto y procedencia de los datos</h3><p>Multiservicios Andina S.R.L. es una empresa ficticia. Se modela la asignación de presupuesto entre cuatro unidades. Todos los valores son supuestos numéricos simulados para fines académicos; no proceden de estados contables reales.</p><h3>Variables financieras</h3><ul>${UNITS.map((u,i)=>`<li><b>x${i+1} (${u}):</b> nivel de asignación presupuestaria recomendado para el periodo, expresado en unidades presupuestarias normalizadas (UPN).</li>`).join("")}</ul><h3>Procesos y reglas de negocio</h3><ol><li>Recepción de necesidades presupuestarias por unidad.</li><li>Consolidación de costos compartidos y dependencias entre unidades.</li><li>Resolución del sistema para obtener una asignación equilibrada.</li><li>Validación de la solución y revisión de residuos antes de apoyar una decisión.</li></ol><p><b>Reglas:</b> se utiliza el mismo conjunto de cuatro unidades en los tres escenarios; la matriz debe ser simétrica definida positiva; la tolerancia de convergencia es 10⁻⁶; una solución que no converge se marca para revisión y no se presenta como válida.</p><h3>Flujo de caja interdepartamental</h3><p>Los términos fuera de la diagonal representan acoplamientos o costos compartidos entre unidades. En este ejemplo, el acoplamiento entre unidades consecutivas es −1 en el caso base. El vector b representa las necesidades netas presupuestarias consolidadas.</p><h3>Valor organizacional</h3><p>El modelo ofrece trazabilidad cuantitativa para comparar escenarios, detectar sensibilidad y apoyar la planificación. No sustituye la aprobación presupuestaria ni constituye asesoramiento financiero real.</p></div>`;
if(page==="modelo")h=title("Formulación matemática","Sistema Ax=b, interpretación de coeficientes y verificación de propiedades.")+`<div class="card"><h3>Significado de las variables</h3><p>${UNITS.map((u,i)=>`x${i+1}: asignación presupuestaria de ${u} (UPN)`).join(" · ")}</p><h3>Interpretación de A</h3><p>Los elementos diagonales aᵢᵢ representan ponderaciones propias de cada unidad; los elementos fuera de la diagonal aᵢⱼ representan acoplamientos o costos compartidos entre unidades. La simetría expresa una interacción recíproca en el modelo. Son coeficientes sintéticos y no tasas contables observadas.</p><h3>Sistema del escenario activo: ${activeLabel()}</h3><div class="matrix" id="modelMatrix">${matrixText(A,b)}</div><h3>Demostración formal de simetría y definición positiva</h3><div id="modelProof">${minorTable(A)}</div><p>Por el criterio de Sylvester, una matriz real simétrica es definida positiva si y solo si todos sus menores principales líderes son positivos. Se verifican los cuatro menores para cada escenario.</p></div>`;
if(page==="datos")h=title("Entrada de datos","Edita A, b, el vector inicial, tolerancia y precondicionador.")+`<div class="card"><label>Cargar escenario base</label><select id="dataScenario">${scenarioOptions()}</select><label>Matriz A (JSON, n×n)</label><textarea id="matrixInput">${JSON.stringify(A,null,2)}</textarea><label>Vector b (JSON)</label><textarea id="rhsInput">${JSON.stringify(b,null,2)}</textarea><div class="row"><div><label>Vector inicial x₀ (JSON)</label><input id="initialInput" value="${JSON.stringify(x0)}"></div><div><label>Tolerancia</label><input id="tolInput" type="number" step="any" value="${tol}"></div><div><label>Máximo de iteraciones</label><input id="maxInput" type="number" value="${maxIt}"></div><div><label>Precondicionador</label><select id="preInput"><option value="jacobi" ${preconditioner==="jacobi"?"selected":""}>Jacobi diagonal</option><option value="none" ${preconditioner==="none"?"selected":""}>Ninguno (GC)</option></select></div></div><p class="small">La tolerancia exigida por la guía es 10⁻⁶. Puedes cambiarla para experimentar; restaura 0.000001 para la evaluación. El precondicionador se aplica en los módulos que comparan GCP vs GC.</p><button class="primary" id="applyData">Validar, aplicar y recalcular</button><div id="dataMsg"></div></div>`;
if(page==="escenarios")h=title("Tres escenarios financieros","Los escenarios comparten variables y estructura del modelo; sus cambios están justificados.")+`<div class="grid">${Object.entries(SCENARIOS).map(([k,s])=>`<div class="card"><h3>${s.name}</h3><p>${s.description}</p><p class="small">${s.why}</p><button class="primary" data-load="${k}">Cargar escenario</button></div>`).join("")}</div><div class="card"><h3>Escenario activo: ${activeLabel()}</h3><div class="matrix">${matrixText(A,b)}</div><div id="scenarioProof">${minorTable(A)}</div></div>`;
if(page==="referencia")h=title("Solución numérica de referencia","Método directo de Gauss con pivoteo parcial, ejecutado sobre el escenario activo.")+`<div class="card"><button class="primary" id="gaussBtn">Resolver Ax=b</button><div id="gaussOut"></div></div>`;
if(page==="metodos")h=title("Gradientes Conjugados Precondicionado vs GC","PCG aplica Mz=r con M=diag(A) (Jacobi); GC se ejecuta sin precondicionar como contraste.")+`<div class="card"><button class="primary" id="methodsBtn">Ejecutar GC y GCP</button><div id="methodsOut"></div></div>`;
if(page==="errores")h=title("Análisis de errores y condicionamiento","Errores por componente respecto a la solución de referencia de Gauss.")+`<div class="card"><button class="primary" id="errorsBtn">Calcular errores y condición</button><div id="errorsOut"></div></div>`;
if(page==="comparativa")h=title("Tabla comparativa obligatoria","Ejecuta los tres escenarios y compara soluciones, errores, iteraciones, condición y residuos.")+`<div class="card"><button class="primary" id="compareBtn">Calcular los tres escenarios</button><div id="compareOut"></div></div>`;
if(page==="qa")h=title("Módulo de pruebas de software (QA)","Casos obligatorios con entrada, resultado esperado, resultado obtenido y conclusión.")+`<div class="card"><button class="primary" id="qaBtn">Ejecutar las cuatro pruebas QA</button><div id="qaOut"></div></div>`;
if(page==="conclusiones")h=title("Conclusiones y referencias","Interpreta los resultados calculados; evita conclusiones no respaldadas por las ejecuciones.")+`<div class="card"><h3>Guía de interpretación</h3><ul><li>Si el residuo relativo final es menor que 10⁻⁶, el criterio de parada se satisface.</li><li>Un número de condición alto indica mayor sensibilidad de la solución ante perturbaciones.</li><li>En estrés se conserva A y se aumenta b en 15 %: cambia el punto de equilibrio, pero κ(A) no cambia.</li><li>En el escenario mal condicionado se modifica el escalamiento diagonal; compara κ(A) con κ(M⁻¹A) para evaluar Jacobi.</li><li>Compara las iteraciones GC y GCP sin asumir que el precondicionador mejora todos los sistemas.</li></ul><div id="conclusionLive"></div><h3>Bibliografía principal</h3><p>Suñagua S., P. (2020). Método de Gradientes Conjugados Precondicionado. <i>Revista Boliviana de Matemática – UMSA</i>, 04, 2–7.</p><p>Golub, G. H. y Van Loan, C. F. (2013). <i>Matrix Computations</i> (4.ª ed.). Johns Hopkins University Press.</p><p>Saad, Y. (2003). <i>Iterative Methods for Sparse Linear Systems</i> (2.ª ed.). SIAM.</p></div>`;
