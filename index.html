<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Métodos Numéricos | Keyla Estrella Huanca Condori</title>
<style>
:root{--navy:#172b46;--blue:#2563eb;--bg:#f3f6fb;--ink:#1e293b;--muted:#64748b;--line:#dbe3ee;--green:#15803d;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:linear-gradient(120deg,#14243a,#24558a);color:white;padding:23px 28px}header h1{margin:0}header p{margin:4px 0 0;color:#dbeafe}
.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 100px)}aside{background:var(--navy);padding:14px;color:white}.student{padding:12px;border-bottom:1px solid #49617d;margin-bottom:12px;color:#dbeafe;font-size:13px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;color:#dbeafe;padding:10px 12px;border-radius:7px;margin:2px 0;cursor:pointer}nav button.active,nav button:hover{background:#315477;color:white}
main{padding:25px;max-width:1400px;width:100%;margin:auto}h2{margin:0 0 5px}h3{margin:17px 0 8px}.muted{color:var(--muted)}
.card{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #0f23410b}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{padding:15px;background:#eef5ff;border:1px solid #d8e7ff;border-radius:9px}.stat strong{display:block;font-size:22px;color:#174b88}
button.primary{background:var(--blue);color:white;border:0;padding:10px 15px;border-radius:7px;cursor:pointer;font-weight:bold}button.secondary{background:#e8eef7;color:#20344f;border:0;padding:9px 13px;border-radius:7px;cursor:pointer}
label{display:block;font-size:13px;font-weight:bold;margin:10px 0 5px}input,select,textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}textarea{min-height:120px;font-family:Consolas,monospace}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:150px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;margin:10px 0}th,td{border:1px solid var(--line);padding:8px;text-align:center}th{background:#edf3fa}
.matrix{font:13px Consolas,monospace;white-space:pre-wrap;background:#f8fafc;padding:12px;border-radius:7px;overflow:auto}
.notice{padding:12px;background:#eff6ff;border-left:4px solid var(--blue);border-radius:6px}.success{padding:10px;background:#f0fdf4;color:var(--green);border-radius:7px}.error{padding:10px;background:#fef2f2;color:var(--red);border-radius:7px}.good{color:var(--green);font-weight:bold}.bad{color:var(--red);font-weight:bold}
footer{text-align:center;padding:18px;color:var(--muted);font-size:12px}

<body>
<header><h1>Desafío Académico de Métodos Numéricos</h1><p>Ingeniería de Sistemas · Modelo financiero de cuatro departamentos</p></header>
<div class="layout">
<aside><div class="student"><b>Estudiante</b><br>Keyla Estrella Huanca Condori<br>Mención: Ingeniería en Sistemas</div>
<nav id="nav">
<button class="active" data-page="inicio">Inicio</button><button data-page="caso">Caso de estudio</button><button data-page="modelo">Formulación matemática</button><button data-page="datos">Entrada de datos</button><button data-page="escenarios">Escenarios</button><button data-page="referencia">Solución Gauss</button><button data-page="metodos">GC vs GCP</button><button data-page="errores">Errores y condición</button><button data-page="comparativa">Comparación global</button><button data-page="qa">Pruebas QA</button><button data-page="conclusiones">Conclusiones</button>
</nav></aside><main id="app"></main></div>
<footer>Proyecto Académico/footer>
<script>
"use strict";
const NAMES=["Operaciones","Tecnología","Comercial","Administración"];
const SCENARIOS={
 ideal:{name:"Escenario ideal",description:"Situación financiera estable con necesidades base.",A:[[8,-1,0,0],[-1,7,-1,0],[0,-1,6,-1],[0,0,-1,5]],b:[800,400,300,200]},
 estres:{name:"Bajo estrés financiero",description:"Aumentan las necesidades financieras; A se conserva para aislar el efecto de b.",A:[[8,-1,0,0],[-1,7,-1,0],[0,-1,6,-1],[0,0,-1,5]],b:[920,460,330,230]},
 mal:{name:"Mal condicionado",description:"Matriz simétrica definida positiva con escalas diagonales diferentes.",A:[[3,-10,0,0],[-10,300,-1000,0],[0,-1000,30000,-100000],[0,0,-100000,3000000]],b:[200,1000,10000,200000]}
};
let active="ideal",A=SCENARIOS.ideal.A.map(r=>r.slice()),b=SCENARIOS.ideal.b.slice(),x0=[0,0,0,0],tol=1e-6,maxIt=1000;
const $=id=>document.getElementById(id),dot=(u,v)=>u.reduce((s,x,i)=>s+x*v[i],0),norm=u=>Math.sqrt(dot(u,u));
const mv=(M,v)=>M.map(r=>dot(r,v)),sub=(u,v)=>u.map((x,i)=>x-v[i]),add=(u,v)=>u.map((x,i)=>x+v[i]),mul=(u,k)=>u.map(x=>x*k);
const fmt=x=>Number(x).toLocaleString("es-BO",{maximumFractionDigits:8}),sci=x=>Number(x).toExponential(4);
const residual=(M,x,r)=>sub(r,mv(M,x)),relres=(M,x,r)=>norm(residual(M,x,r))/(norm(r)||1);
function validate(M,r){let n=r.length;if(!n||M.length!==n||M.some(row=>row.length!==n))throw Error("La matriz debe ser cuadrada y compatible con b.");if(!M.flat().every(Number.isFinite)||!r.every(Number.isFinite))throw Error("Todos los datos deben ser números finitos.");}
function cholesky(M){validate(M,M.map(()=>0));let n=M.length,L=Array.from({length:n},()=>Array(n).fill(0)),s=Math.max(1,...M.flat().map(Math.abs));for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(Math.abs(M[i][j]-M[j][i])>1e-12*s)throw Error("La matriz no es simétrica.");for(let i=0;i<n;i++)for(let j=0;j<=i;j++){let q=M[i][j];for(let k=0;k<j;k++)q-=L[i][k]*L[j][k];if(i===j){if(q<=1e-14*s)throw Error("La matriz no es definida positiva.");L[i][j]=Math.sqrt(q);}else L[i][j]=q/L[j][j];}return L;}
function gauss(M,r){validate(M,r);let n=r.length,T=M.map((row,i)=>row.concat(r[i]));for(let k=0;k<n;k++){let p=k;for(let i=k+1;i<n;i++)if(Math.abs(T[i][k])>Math.abs(T[p][k]))p=i;if(Math.abs(T[p][k])<1e-14)throw Error("Matriz singular o casi singular.");[T[p],T[k]]=[T[k],T[p]];for(let i=k+1;i<n;i++){let f=T[i][k]/T[k][k];for(let j=k;j<=n;j++)T[i][j]-=f*T[k][j];}}let x=Array(n).fill(0);for(let i=n-1;i>=0;i--){let q=T[i][n];for(let j=i+1;j<n;j++)q-=T[i][j]*x[j];x[i]=q/T[i][i];}return x;}
function cg(M,r,pre=false){validate(M,r);cholesky(M);if(pre&&M.some((row,i)=>row[i]<=0))throw Error("Jacobi requiere diagonal positiva.");let x=x0.slice(),rr=residual(M,x,r),z=pre?rr.map((v,i)=>v/M[i][i]):rr.slice(),p=z.slice(),rho=dot(rr,z),rel=norm(rr)/(norm(r)||1);if(rel<tol)return{x,it:0,rel,ok:true};for(let k=0;k<maxIt;k++){let Ap=mv(M,p),den=dot(p,Ap);if(!(den>0))throw Error("Dirección no positiva; revisa la matriz.");let alpha=rho/den;x=add(x,mul(p,alpha));let rn=sub(rr,mul(Ap,alpha));rel=norm(rn)/(norm(r)||1);if(rel<tol)return{x,it:k+1,rel,ok:true};let zn=pre?rn.map((v,i)=>v/M[i][i]):rn.slice(),rhon=dot(rn,zn),beta=rhon/rho;p=add(zn,mul(p,beta));rr=rn;rho=rhon;}return{x,it:maxIt,rel,ok:false};}
function inverse(M){let n=M.length,T=M.map((r,i)=>r.concat(Array.from({length:n},(_,j)=>i===j?1:0)));for(let k=0;k<n;k++){let p=k;for(let i=k+1;i<n;i++)if(Math.abs(T[i][k])>Math.abs(T[p][k]))p=i;if(Math.abs(T[p][k])<1e-18)throw Error("Matriz no invertible.");[T[p],T[k]]=[T[k],T[p]];let d=T[k][k];for(let j=0;j<2*n;j++)T[k][j]/=d;for(let i=0;i<n;i++)if(i!==k){let f=T[i][k];for(let j=0;j<2*n;j++)T[i][j]-=f*T[k][j];}}return T.map(r=>r.slice(n));}
const normInf=M=>Math.max(...M.map(r=>r.reduce((s,v)=>s+Math.abs(v),0)));
const cond=M=>normInf(M)*normInf(inverse(M));
function scaled(M){return M.map((r,i)=>r.map(v=>v/M[i][i]));}
function determinant(M){if(M.length===1)return M[0][0];let d=0;for(let j=0;j<M.length;j++)d+=(j%2?-1:1)*M[0][j]*determinant(M.slice(1).map(r=>r.filter((_,k)=>k!==j)));return d;}
function minors(M){return M.map((_,i)=>determinant(M.slice(0,i+1).map(r=>r.slice(0,i+1))));}
function vecTable(x){return `<div class="tablewrap"><table><tr><th>Variable</th><th>Valor</th></tr>${x.map((v,i)=>`<tr><td>x${i+1} · ${NAMES[i]}</td><td>${fmt(v)}</td></tr>`).join("")}</table></div>`;}
function opts(){return Object.entries(SCENARIOS).map(([k,s])=>`<option value="${k}" ${k===active?"selected":""}>${s.name}</option>`).join("");}
function title(t,d){return `<h2>${t}</h2><p class="muted">${d}</p>`;}
function render(p){let h="";
if(p==="inicio")h=title("Panel del proyecto","Aplicación académica para resolver sistemas lineales y comparar métodos iterativos.")+`<div class="grid"><div class="stat">Escenarios<strong>3</strong></div><div class="stat">Variables<strong>4</strong></div><div class="stat">Métodos<strong>GC / GCP</strong></div><div class="stat">Tolerancia<strong>10⁻⁶</strong></div></div><div class="card"><h3>Estudiante: Estrella Condori</h3><p><b>Empresa:</b> Multiservicios Andina S.R.L. (ficticia).</p><p>Modelo de planificación financiera para Operaciones, Tecnología, Comercial y Administración.</p><div class="notice">Datos simulados con fines académicos. La aplicación permite modificar los coeficientes y recalcular resultados.</div></div>`;
if(p==="caso")h=title("Caso de estudio","Planificación financiera interdepartamental.")+`<div class="card"><h3>Contexto</h3><p>La empresa ficticia distribuye recursos entre cuatro departamentos. El problema se representa mediante la minimización de ½xᵀAx − bᵀx, cuya condición de primer orden es Ax=b.</p><h3>Supuestos</h3><ol><li>Se mantienen cuatro variables departamentales.</li><li>Los coeficientes son ponderaciones sintéticas.</li><li>En estrés aumenta b para representar mayores necesidades.</li><li>El escenario mal condicionado contiene escalas distintas.</li></ol><p>Unidad: unidades presupuestarias normalizadas (UPN), no moneda real.</p></div>`;
if(p==="modelo")h=title("Formulación matemática","Sistema Ax=b, variables y propiedades.")+`<div class="card"><h3>Variables</h3><p>${NAMES.map((n,i)=>`x${i+1}: ${n}`).join(" · ")}</p><h3>Ecuaciones del escenario ideal</h3><div class="matrix">8x₁ − x₂ = 800\n−x₁ + 7x₂ − x₃ = 400\n−x₂ + 6x₃ − x₄ = 300\n−x₃ + 5x₄ = 200</div><p>Matriz A y vector b: A = [[8,-1,0,0],[-1,7,-1,0],[0,-1,6,-1],[0,0,-1,5]], b = [800,400,300,200]ᵀ.</p><p>Para aplicar GC y GCP se requiere que A sea simétrica definida positiva. El criterio de Sylvester verifica que sus menores principales líderes sean positivos.</p><div id="minorInfo"></div></div>`;
if(p==="datos")h=title("Entrada de datos","Edita matriz, vector, aproximación inicial y parámetros.")+`<div class="card"><label>Escenario base</label><select id="dataScenario">${opts()}</select><label>Matriz A (JSON)</label><textarea id="matrixInput">${JSON.stringify(A,null,2)}</textarea><label>Vector b (JSON)</label><textarea id="rhsInput">${JSON.stringify(b,null,2)}</textarea><div class="row"><div><label>Vector inicial x₀</label><input id="initialInput" value="${JSON.stringify(x0)}"></div><div><label>Tolerancia</label><input id="tolInput" type="number" step="any" value="${tol}"></div><div><label>Máximo iteraciones</label><input id="maxInput" type="number" value="${maxIt}"></div></div><button class="primary" id="applyData">Validar y aplicar</button><div id="dataMsg"></div></div>`;
if(p==="escenarios")h=title("Escenarios financieros","Carga los datos de cada escenario.")+`<div class="grid">${Object.entries(SCENARIOS).map(([k,s])=>`<div class="card"><h3>${s.name}</h3><p>${s.description}</p><button class="primary" data-load="${k}">Cargar</button></div>`).join("")}</div><div class="card"><h3>Datos activos: ${SCENARIOS[active].name}</h3><div class="matrix">A =\n${A.map(r=>r.join("  ")).join("\n")}\n\nb = ${JSON.stringify(b)}</div></div>`;
if(p==="referencia")h=title("Solución de referencia","Eliminación de Gauss con pivoteo parcial.")+`<div class="card"><button class="primary" id="gaussBtn">Resolver Ax=b</button><div id="gaussOut"></div></div>`;
if(p==="metodos")h=title("Comparación GC y GCP","GCP utiliza precondicionador diagonal de Jacobi.")+`<div class="card"><button class="primary" id="methodsBtn">Ejecutar ambos métodos</button><div id="methodsOut"></div></div>`;
if(p==="errores")h=title("Errores y condicionamiento","Errores de GCP respecto a la referencia de Gauss.")+`<div class="card"><button class="primary" id="errorsBtn">Calcular errores</button><div id="errorsOut"></div></div>`;
if(p==="comparativa")h=title("Comparación global","Recalcula los tres escenarios con la tolerancia indicada.")+`<div class="card"><div class="row"><div><label>Tolerancia</label><input id="ctol" type="number" step="any" value="0.000001"></div><div><label>Máximo de iteraciones</label><input id="cit" type="number" value="1000"></div></div><button class="primary" id="compareBtn">Calcular comparación completa</button><div id="compareOut"></div></div>`;
if(p==="qa")h=title("Pruebas de calidad (QA)","Ejecuta pruebas de validación y cálculo.")+`<div class="card"><button class="primary" id="qaBtn">Ejecutar pruebas QA</button><div id="qaOut"></div></div>`;
if(p==="conclusiones")h=title("Conclusiones y bibliografía","Interpreta los resultados obtenidos en la aplicación.")+`<div class="card"><h3>Aspectos para discutir</h3><ol><li>Convergencia de GC y GCP en cada escenario.</li><li>Diferencia de iteraciones y residuos.</li><li>Efecto del aumento de b en el escenario de estrés.</li><li>Sensibilidad numérica reflejada en el número de condición.</li><li>Efecto del precondicionador de Jacobi.</li></ol><h3>Referencias</h3><p>Golub, G. H. y Van Loan, C. F. (2013). <i>Matrix Computations</i> (4.ª ed.). Johns Hopkins University Press.</p><p>Saad, Y. (2003). <i>Iterative Methods for Sparse Linear Systems</i> (2.ª ed.). SIAM.</p><p>Suñagua S., P. (2020). Método de Gradientes Conjugados Precondicionado. <i>Revista Boliviana de Matemática – UMSA</i>.</p></div>`;
$("app").innerHTML=h;
if(p==="modelo")$("minorInfo").innerHTML=minorTable(A);
if(p==="datos"){$("applyData").onclick=applyData;$("dataScenario").onchange=e=>{let s=SCENARIOS[e.target.value];$("matrixInput").value=JSON.stringify(s.A,null,2);$("rhsInput").value=JSON.stringify(s.b,null,2);};}
document.querySelectorAll("[data-load]").forEach(el=>el.onclick=()=>load(el.dataset.load,p));
if(p==="referencia")$("gaussBtn").onclick=()=>{try{let x=gauss(A,b);$("gaussOut").innerHTML=vecTable(x)+`<p>Residuo relativo: ${sci(relres(A,x,b))}</p>`;}catch(e){$("gaussOut").innerHTML=`<p class="error">${e.message}</p>`;}};
if(p==="metodos")$("methodsBtn").onclick=methods;
if(p==="errores")$("errorsBtn").onclick=errors;
if(p==="comparativa")$("compareBtn").onclick=compare;
if(p==="qa")$("qaBtn").onclick=qa;
}
function minorTable(M){try{return `<table><tr><th>Menor</th><th>Determinante</th><th>Estado</th></tr>${minors(M).map((v,i)=>`<tr><td>Δ${i+1}</td><td>${sci(v)}</td><td class="${v>0?"good":"bad"}">${v>0?"Positivo":"No positivo"}</td></tr>`).join("")}</table>`;}catch(e){return `<p class="error">${e.message}</p>`;}}
function load(k,p){active=k;A=SCENARIOS[k].A.map(r=>r.slice());b=SCENARIOS[k].b.slice();x0=Array(b.length).fill(0);render(p);}
function applyData(){try{let M=JSON.parse($("matrixInput").value),r=JSON.parse($("rhsInput").value),x=JSON.parse($("initialInput").value),t=Number($("tolInput").value),it=Number($("maxInput").value);validate(M,r);if(x.length!==r.length||!x.every(Number.isFinite))throw Error("x₀ debe tener la misma dimensión que b.");if(!(t>0)||!(it>=1))throw Error("Tolerancia y máximo de iteraciones deben ser positivos.");A=M;b=r;x0=x;tol=t;maxIt=Math.floor(it);$("dataMsg").innerHTML='<p class="success">Datos validados y aplicados correctamente.</p>';}catch(e){$("dataMsg").innerHTML=`<p class="error">${e.message}</p>`;}}
function methods(){try{let g=cg(A,b),p=cg(A,b,true);$("methodsOut").innerHTML=`<div class="grid"><div class="card"><h3>GC</h3>${vecTable(g.x)}<p>Iteraciones: ${g.it}</p><p>Residuo relativo: ${sci(g.rel)}</p><p class="${g.ok?"good":"bad"}">${g.ok?"CONVERGIÓ":"NO CONVERGIÓ"}</p></div><div class="card"><h3>GCP (Jacobi)</h3>${vecTable(p.x)}<p>Iteraciones: ${p.it}</p><p>Residuo relativo: ${sci(p.rel)}</p><p class="${p.ok?"good":"bad"}">${p.ok?"CONVERGIÓ":"NO CONVERGIÓ"}</p></div></div>`;}catch(e){$("methodsOut").innerHTML=`<p class="error">${e.message}</p>`;}}
function errors(){try{let ref=gauss(A,b),p=cg(A,b,true),rows=ref.map((v,i)=>{let ea=Math.abs(v-p.x[i]),er=v===0?null:ea/Math.abs(v);return `<tr><td>x${i+1} · ${NAMES[i]}</td><td>${fmt(v)}</td><td>${fmt(p.x[i])}</td><td>${sci(ea)}</td><td>${er===null?"No definido":sci(er)}</td><td>${er===null?"No definido":sci(er*100)+"%"}</td></tr>`;}).join("");$("errorsOut").innerHTML=`<div class="tablewrap"><table><tr><th>Variable</th><th>Gauss</th><th>GCP</th><th>Error absoluto</th><th>Relativo</th><th>Porcentual</th></tr>${rows}</table></div><p>Residuo relativo GCP: ${sci(relres(A,p.x,b))}</p><p>κ∞(A): ${sci(cond(A))}</p><p>κ∞(D⁻¹A): ${sci(cond(scaled(A)))}</p>`;}catch(e){$("errorsOut").innerHTML=`<p class="error">${e.message}</p>`;}}
function compare(){let old={A,b,x0,tol,maxIt};try{let t=Number($("ctol").value),it=Number($("cit").value);if(!(t>0)||it<1)throw Error("Parámetros inválidos.");tol=t;maxIt=Math.floor(it);let R={};for(let [k,s] of Object.entries(SCENARIOS)){A=s.A.map(r=>r.slice());b=s.b.slice();x0=Array(b.length).fill(0);let ref=gauss(A,b),g=cg(A,b),p=cg(A,b,true),errs=ref.map((v,i)=>{let a=Math.abs(v-p.x[i]);return[a,v===0?null:a/Math.abs(v)];});R[k]={ref,g,p,errs,ca:cond(A),cp:cond(scaled(A)),res:relres(A,p.x,b)};}
let keys=["ideal","estres","mal"],out='<h3>Resumen comparativo</h3><div class="tablewrap"><table><tr><th>Indicador</th><th>Ideal</th><th>Bajo estrés</th><th>Mal condicionado</th></tr>';
let rows=[["Solución Gauss",k=>R[k].ref.map(fmt).join(", ")],["Solución GCP",k=>R[k].p.x.map(fmt).join(", ")],["Iteraciones GC",k=>R[k].g.it],["Iteraciones GCP",k=>R[k].p.it],["κ∞(A)",k=>sci(R[k].ca)],["κ∞(D⁻¹A)",k=>sci(R[k].cp)],["Residuo GCP",k=>sci(R[k].res)],["Convergencia GC/GCP",k=>(R[k].g.ok?"Sí":"No")+" / "+(R[k].p.ok?"Sí":"No")]];
for(let [label,fn] of rows)out+=`<tr><th>${label}</th>${keys.map(k=>`<td>${fn(k)}</td>`).join("")}</tr>`;out+='</table></div><h3>Errores de GCP por variable</h3>';
for(let i=0;i<4;i++){out+=`<h4>x${i+1} · ${NAMES[i]}</h4><table><tr><th>Error</th><th>Ideal</th><th>Estrés</th><th>Mal condicionado</th></tr>`;for(let [label,j] of [["Absoluto",0],["Relativo",1],["Porcentual",2]])out+=`<tr><th>${label}</th>${keys.map(k=>{let v=R[k].errs[i][j];if(j===2&&v!==null)v*=100;return `<td>${v===null?"No definido":sci(v)+(j===2?"%":"")}</td>`;}).join("")}</tr>`;out+='</table>';}
out+=`<div class="notice">Criterio: ||b−Ax||₂ / ||b||₂ &lt; ${sci(t)}. Vector inicial cero. Referencia: Gauss con pivoteo parcial. Condición: norma infinito. En estrés A se conserva y aumenta b; por ello la solución cambia pero κ(A) permanece igual.</div>`;$("compareOut").innerHTML=out;
}catch(e){$("compareOut").innerHTML=`<p class="error">${e.message}</p>`;}finally{Object.assign(window,{});A=old.A;b=old.b;x0=old.x0;tol=old.tol;maxIt=old.maxIt;}}
